name: Update menu
on:
  schedule:
    - cron: "30 5 * * 1-5"   # Mon-Fri, about 07:30 in Bonn
  workflow_dispatch:          # lets you also start it by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install anthropic
      - run: python fetch_menu.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Save menu.json
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add menu.json
          git commit -m "Update menu" || echo "No changes"
          git push
